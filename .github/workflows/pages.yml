name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Mesmo esquema do ferramentas/neurobaby.ps1: dependências numa pasta separada do código
      - name: Instalar dependências
        run: |
          mkdir -p "$RUNNER_TEMP/deps"
          cp package.json ferramentas/vite.config.mjs "$RUNNER_TEMP/deps/"
          npm install --prefix "$RUNNER_TEMP/deps" --no-audit --no-fund
      - name: Build
        env:
          NEUROBABY_ROOT: ${{ github.workspace }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: node "$RUNNER_TEMP/deps/node_modules/vite/bin/vite.js" build --config "$RUNNER_TEMP/deps/vite.config.mjs"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
